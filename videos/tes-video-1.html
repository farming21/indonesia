<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Video 1</title>
    <meta name="description" content="Tes video 1">
    <meta property="og:title" content="Tes Video 1">
    <meta property="og:description" content="Tes video 1">
    <meta property="og:image" content="../assets/img/no-cover.svg">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <a href="../index.html" class="back-btn">&larr; Kembali ke Beranda</a>
    </header>
    
    <main class="video-detail">
        <h1>Tes Video 1</h1>
        <p class="meta-info">Kategori: <strong>papua</strong> | Tanggal: 2026-09-02</p>
        
        <div class="video-player video-player-poster" id="videoPlayer">
            <div class="video-poster" id="videoPoster" role="button" tabindex="0" aria-label="Putar Tes Video 1">
                <img src="../assets/img/no-cover.svg" alt="Tes Video 1" loading="eager">
                <button class="video-play-button" id="videoPlayButton" type="button" aria-label="Putar video">
                    <span aria-hidden="true">▶</span>
                </button>
            </div>
            <iframe
                id="drivePlayer"
                src="about:blank"
                data-src="https://drive.google.com/file/d/1mBwaa8uml_JNZatPeYI3VOCfNphCv6L5/preview"
                title="Tes Video 1"
                allow="autoplay; fullscreen"
                allowfullscreen
                loading="lazy"
                style="display:none;">
            </iframe>
        </div>

        <script>
        (function () {
            const poster = document.getElementById('videoPoster');
            const button = document.getElementById('videoPlayButton');
            const iframe = document.getElementById('drivePlayer');
            if (!poster || !iframe) return;

            function openPlayer() {
                if (iframe.src === 'about:blank') {
                    iframe.src = iframe.dataset.src;
                }
                poster.style.display = 'none';
                iframe.style.display = 'block';
            }

            poster.addEventListener('click', openPlayer);
            poster.addEventListener('keydown', function (event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    openPlayer();
                }
            });
            if (button) button.addEventListener('click', function (event) {
                event.stopPropagation();
                openPlayer();
            });
        })();
        </script>
        
        <div class="description">
            <h3>Deskripsi</h3>
            <p>Tes video 1</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Farming21. All rights reserved.</p>
    </footer>
</body>
</html>
